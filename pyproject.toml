[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-scanner"
version = "0.1.0"
description = "CLI tool to analyze drives and scan for files matching configurable filter rules"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.scripts]
drivescan = "drive_scanner.cli:app"

[tool.setuptools.packages.find]
include = ["drive_scanner*"]
